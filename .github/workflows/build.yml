name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          ls -la
          SPEC=$(ls | grep -iE '^project\.ya?ml$' | head -1)
          xcodegen generate --spec "$SPEC"

      - name: Build (unsigned)
        run: |
          xcodebuild -project WobbleWheels.xcodeproj \
            -scheme WobbleWheels \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/WobbleWheels.app Payload/
          zip -r WobbleWheels.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WobbleWheels-ipa
          path: WobbleWheels.ipa
